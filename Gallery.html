<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Products</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    /* Top Navigation Bar */
    header {
      background-color: #1a252f;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    header nav a {
      color: #ecf0f1;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    header nav a:hover, header nav a.active-link {
      color: #3498db;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    /* Category Filter Buttons */
    .filter-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid #3498db;
      background-color: #fff;
      color: #3498db;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background-color: #3498db;
      color: #fff;
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .gallery-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      border: 1px solid #e1e8ed;
      transition: transform 0.2s ease;
    }

    .gallery-card:hover {
      transform: translateY(-5px);
    }

    /* Image Box - Uniform Ratio & Zoom Effect */
    .img-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background-color: #e9ecef;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .img-box:hover img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 15px;
      text-align: center;
    }

    .card-info h3 {
      font-size: 16px;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    .card-info span {
      font-size: 13px;
      color: #7f8c8d;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Navigation Menu -->
  <header>
    <a href="index.html" class="logo">Company Name</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active-link">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h1>Our Product Gallery</h1>

    <!-- Filter Buttons -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterGallery('all')">All Products</button>
      <button class="tab-btn" onclick="filterGallery('category-1')">Category 1</button>
      <button class="tab-btn" onclick="filterGallery('category-2')">Category 2</button>
    </div>

    <!-- Images Grid -->
    <div class="gallery-grid">

      <!-- Product Card 1 -->
      <div class="gallery-card category-1">
        <div class="img-box">
          <img src="item1.jpg" alt="Product 1">
        </div>
        <div class="card-info">
          <h3>Product Item 01</h3>
          <span>Category 1</span>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="gallery-card category-2">
        <div class="img-box">
          <img src="item2.jpg" alt="Product 2">
        </div>
        <div class="card-info">
          <h3>Product Item 02</h3>
          <span>Category 2</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Filter Script -->
  <script>
    function filterGallery(category) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const cards = document.querySelectorAll('.gallery-card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
